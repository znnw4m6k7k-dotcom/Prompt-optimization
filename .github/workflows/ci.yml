name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    env:
      PROMPT_REFINERY_PROVIDER: heuristic
      PROMPT_REFINERY_CONFIG: ${{ github.workspace }}/.ci-missing-config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run eval
      - run: npm pack --dry-run

  mcp-smoke:
    name: MCP stdio smoke test
    runs-on: ubuntu-latest
    env:
      PROMPT_REFINERY_PROVIDER: heuristic
      PROMPT_REFINERY_CONFIG: ${{ github.workspace }}/.ci-missing-config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Initialize and list tools
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node bin/prompt-refinery.js mcp > mcp-output.jsonl
          node -e "const fs=require('fs');const lines=fs.readFileSync('mcp-output.jsonl','utf8').trim().split('\\n').map(JSON.parse);if(lines.length!==2)process.exit(1);if(lines[1].result.tools[0].name!=='enhance_prompt')process.exit(1);console.log('MCP OK')"
