name: Bug report
description: Report a reproducible defect
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private prompts, or customer data. Use Security Advisories for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - HTTP
        - MCP
        - Library
        - Packaging
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal command, request, or MCP messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error code and sanitized output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 22.22.2, heuristic provider
